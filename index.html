<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación XV - Valeria</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- 🎬 INTRO VIDEO -->
<div id="intro-video-container">
    <video id="introVideo" playsinline webkit-playsinline preload="auto">
        <source src="IntroDisney.mp4" type="video/mp4">
    </video>
</div>

<audio id="introSound" src="Veo en ti.mp3"></audio>
<audio id="music" src="Veo en ti.mp3" loop></audio>

<!-- 💌 CARTA -->
<section class="letter-scene">
    <div class="letter-wrapper">
        <img src="Cq.png" class="letter-img" onclick="enterSite()">
    </div>
</section>

<!-- 🏮 LINTERNAS -->
<div id="lantern-container"></div>

<!-- 🎬 SECCIÓN 1 -->
<section class="hero-pro  id="mainContent">

    <!-- 🆕 Imagen izquierda -->
    <div class="hero-left">
        <img src="LK1.png" class="lk1">
        <img src="LK3.png" class="lk1">
        <p class="lk-text">Un momento muy especial ✨</p>
        <img src="LK4.png" class="lk1">
    </div>

    <div class="hero-wrap">
        <img class="circulito" src="circulo.png">
        <div class="Quinceanera">
            <img src="KK1.png">
        </div>
    </div>
</section>

<!-- 🎬 SECCIÓN 2 -->
<section class="hero-Info " id="Info">


    <div class="info-content">
        <h1 class="nombre">Valeria</h1>
        <p class="texto">Mis XV Años</p>
    </div>

</section>

<!-- 🎬 SECCIÓN 3 -->
<section class="hero-locations " id="Locations">
    <div class="Tittle">
        <h1>Ver ubicaciones 📍:</h1>
    </div>

    <div class="locations-cards">
        <div class="location-card" onclick="openChurch()">
            <img src="Iglesia.jpg">
            <h3>⛪ Iglesia del Sagrado Corazon de Jesus</h3>
            <p>Ver ubicación</p>
        </div>

        <div class="location-card" onclick="openHall()">
            <img src="Jardin.jpg">
            <h3>🎉 Jardin de eventos MG</h3>
            <p>Ver ubicación</p>
        </div>
    </div>
</section>

<!-- 🎬 SECCIÓN 4 -->
<section class="hero-countdown " id="Countdown">
    <div class="countdown-box">
        <h2>Faltan para mis XV ✨</h2>

        <div class="timer">
            <div><span id="days">00</span><p>Días</p></div>
            <div><span id="hours">00</span><p>Horas</p></div>
            <div><span id="minutes">00</span><p>Min</p></div>
            <div><span id="seconds">00</span><p>Seg</p></div>
        </div>

        <button onclick="confirmarAsistencia()">Confirmar asistencia 💌</button>
    </div>
</section>

<img src="Pascal.png" id="pascal">

<script src="script.js"></script>
</body>
</html>
